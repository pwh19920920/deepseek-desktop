# Desktop-specific patches applied over the web-app bundle.
# These override default behavior for the desktop experience.

# Bind only to loopback; the desktop app never exposes the harness to the network.
- id: webserver
  config:
    host: 127.0.0.1
    port: 0  # random port — sidecar discovers it via stdout parsing

# The Tauri WebView origin is not a real HTTP origin, so no extra trusted hosts
# are needed. The harness trust fence checks for loopback and accepts it.
- id: client-connection
  config:
    trustedHosts: []
