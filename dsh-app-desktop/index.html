<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e4e4e7;
      -webkit-app-region: drag;
    }
    .container {
      text-align: center;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo img {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #f4f4f5;
    }
    .phase-label {
      color: #4fc3f7;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      min-height: 1.2em;
    }
    .error-detail {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .progress-container {
      width: 100%;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #7c4dff);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-steps {
      display: flex;
      justify-content: space-between;
      padding: 0 0.5rem;
    }
    .progress-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a3a5a;
      transition: all 0.3s ease;
    }
    .step-dot.active {
      background: #4fc3f7;
      box-shadow: 0 0 8px rgba(79, 195, 247, 0.5);
    }
    .step-label {
      font-size: 0.7rem;
      color: #6a6a8a;
      transition: color 0.3s ease;
    }
    .progress-step.active .step-label {
      color: #a0a0c0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="container">
      <div class="logo">
        <img src="src-tauri/icons/dock-icon.png" alt="DeepSeek Harness" />
      </div>
      <h1>DeepSeek Harness</h1>
      <p class="phase-label">正在初始化…</p>
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" style="width: 25%"></div>
        </div>
        <div class="progress-steps">
          <div class="progress-step active">
            <div class="step-dot active"></div>
            <span class="step-label">初始化</span>
          </div>
          <div class="progress-step">
            <div class="step-dot"></div>
            <span class="step-label">配置</span>
          </div>
          <div class="progress-step">
            <div class="step-dot"></div>
            <span class="step-label">运行时</span>
          </div>
          <div class="progress-step">
            <div class="step-dot"></div>
            <span class="step-label">服务</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
