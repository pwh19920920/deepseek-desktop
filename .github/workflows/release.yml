name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: x86_64-pc-windows-msvc
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu --bundles deb,rpm'
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch Node.js binary
        run: node scripts/fetch-node.js ${{ matrix.target }}

      - name: Build frontend
        run: pnpm --filter dsh-app-desktop exec vite build

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev

      - name: Build
        run: pnpm tauri build ${{ matrix.args }}
        working-directory: dsh-app-desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dsh-app-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            dsh-app-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            dsh-app-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            dsh-app-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            dsh-app-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            # Windows: include the setup exe but exclude system dependencies
            dsh-app-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            !**/OpenConsole.exe

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*